# ============================================================================
# v0_mini -- the whole dataset, in miniature.
#
#   python -m physloc.cli taxonomy --config v0_mini    # price it first
#   python -m physloc.cli generate --config v0_mini
#   python -m physloc.cli validate out/physloc_v0_mini
#   python -m physloc.cli viz      out/physloc_v0_mini
#
# NOT a review sweep -- the same structure as the release, made small. Every
# family, every complexity rung, every difficulty condition and every severity
# bin, so what you learn from it transfers to the real thing. Roughly 15 h at
# four workers.
#
# It is small in CELLS, not in variants, and that is forced rather than chosen.
# The condition cycle has ten slots and the rungs take a share of them, so it
# takes TEN variants before all four rungs and all five conditions appear:
#
#     variants=2   L0 2, L1 1, L2 1, L3 0   -> 1 of 5 conditions
#     variants=4   L0 4, L1 2, L2 1, L3 1   -> 3 of 5
#     variants=10  L0 10, L1 5, L2 3, L3 2  -> 5 of 5
#
# So the variants stay at ten and the scenario list shrinks instead. Three
# scenarios cover all 23 families between them -- `pour`, `shadow_track` and
# `drop`, a set cover over `taxonomy.COMPATIBILITY` -- which is 41 cells rather
# than 166 and keeps every family represented.
#
# Drop to `severity: strong` for a third of the cost if the magnitude ladder is
# not what you are looking at; `review_severity` answers that in eight minutes.
#
# PUBLISH IT:
#
#   PHYSLOC_PUSH_TO=<user>/physloc-v0-mini bash scripts/run.sh v0_mini
#
# See configs/review.yaml for what every key means, and configs/common.yaml for
# the generation knobs -- shares, object counts, camera bands -- which any
# config may override in its own `params:` block.
# ============================================================================

defaults:
  seed: 20260824
  tier: debug          # 128x128, 12 fps, 25 frames -- never published
  complexity: all      # the whole built ladder, at its declared shares
  severity: all        # the full weak/medium/strong ladder
  variants: 10         # a full turn of the condition cycle; see above
  scenario: pour,shadow_track,drop

generate:
  keep_going: true
  workers: 4
  workdir: out/work_v0_mini
  outdir: out/physloc_v0_mini
