# ============================================================================
# v0_L0 -- the published dataset, at ONE rung of the ladder.
#
#   python -m physloc.cli taxonomy --config v0_L0    # PRICE IT FIRST
#   python -m physloc.cli generate --config v0_L0
#   python -m physloc.cli validate out/physloc_v0_L0
#   python -m physloc.cli export   out/physloc_v0_L0 --push-to <user>/physloc-l0
#
# L0 adds the baseline.
#
# Primitives, flat colours, one shared density, a solid background.
# The reference every other rung is measured against, and the cheapest by
# a wide margin -- about a tenth of an L2 clip.
#
# WHY A CONFIG PER RUNG. `v0_release` walks the whole ladder in one run and is
# the thing to publish; these exist for when you want one rung on its own --
# to spread a release across machines a rung at a time, to regenerate a single
# rung after a fix, or to ship a smaller dataset that is only ever L0.
#
# Each writes to its OWN outdir, so rungs generated separately can simply be
# merged: the clip tree is keyed by rung already
# (`clips/<release>/L0/<scenario>/<seed>/`) and every rung draws from its own
# seed block, so nothing collides.
#
# The five difficulty conditions apply here exactly as they do in a full run --
# they are not rungs, and every rung carries all of them.
#
# See configs/review.yaml for what every key means.
#
# PUBLISH IT. Packaging always happens; uploading is opt-in, because packaging
# is local and repeatable and uploading is neither. Copy-paste:
#
#   PHYSLOC_PUSH_TO=<user>/physloc-v0_L0 bash scripts/run.sh v0_L0
#
# ...or set the owner once and every run publishes under its own name:
#
#   export PHYSLOC_PUSH_OWNER=<user>
#   bash scripts/run.sh v0_L0          # -> <user>/physloc-v0_L0
#
# Add PHYSLOC_PUSH_PRIVATE=1 for a private repo. A push REPLACES the card and
# index at that id, so a distinct name per artefact keeps a review sweep from
# overwriting a release.
# ============================================================================

defaults:
  seed: 20260824
  tier: release        # 512x512, 30 fps, 89 frames = 2.97 s
  complexity: L0
  severity: all        # the full weak/medium/strong ladder
  # THE SHARE THIS RUNG WOULD GET IN A FULL RUN, so the four configs PARTITION
  # `v0_release` rather than each being a release of their own: generating all
  # four gives exactly what `--complexity all --variants 10` gives, and
  # generating one gives exactly that rung's part of it.
  #
  # `variants_at("L0", 10)` = 10, from the rung's declared share.
  variants: 10

generate:
  keep_going: true
  workers: 4
  workdir: out/work_v0_L0
  outdir: out/physloc_v0_L0
