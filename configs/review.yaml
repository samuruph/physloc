# ============================================================================
# review -- every cell once, at debug size. The sweep to WATCH before
# generating anything real.
#
#   python -m physloc.cli generate --config review
#   python -m physloc.cli validate out/release
#   python -m physloc.cli coverage out/release     # all cells in one video
#
# Any flag you type on the command line overrides what is written here, so
# `--config review --tier release` is this sweep at release size.
# ============================================================================

# --------------------------------------------------------------------------
# defaults: applied to EVERY subcommand that understands the key, and silently
# skipped by those that do not (`taxonomy` has no --seed, so it ignores it).
# This is where a setting goes when `generate` and `taxonomy` should agree on
# it -- which is the point of `taxonomy`, since it prices exactly the run that
# `generate` would perform.
# --------------------------------------------------------------------------
defaults:

  # seed: base random seed. Drives EVERY free parameter a scenario has --
  #   sizes, speeds, drop heights, restitution, colours, the HDRI at L1, the
  #   camera, the lamp direction, and whether the actor is a sphere or a cube
  #   where that is physically neutral. Variant N uses seed+N.
  seed: 777

  # complexity: how photographic the scene is. THE EXPENSIVE DIAL -- far more
  #   than the severity ladder. L1 costs about 5.5x an L0 render, which turns
  #   an overnight job into a week.
  #     L0  solid background + one sun lamp. No network. (built)
  #     L1  HDRI environment + dome backdrop, MOVi-style.  (built)
  #     L2..L4  scaffolded, not built -- see `physloc taxonomy`
  complexity: L2

  # tier: the resolution/length ladder. `physloc taxonomy` prints the table.
  #     debug  128x128, 12 fps, 25 frames, 16 spp -- NEVER published
  #     v0     256x256, 12 fps, 49 frames, 64 spp
  #     v1     512x512, 24 fps, 97 frames, 64 spp
  #   Individual dials below can override any of these without inventing a
  #   new tier.
  tier: debug

  # variants: randomisations per cell. Each is a fresh seed, so six variants
  #   of `drop x solidity` are six visibly different clips of the same
  #   violation -- not one clip with a different number in the filename.
  #
  #   In `defaults`, not `generate`, so that `taxonomy --config review` prices
  #   the run `generate --config review` actually performs. Under `generate` it
  #   was invisible to `taxonomy`, which fell back to its own default of 5 and
  #   quoted five times the real cost.
  variants: 1

  # severity: which magnitude bins to generate.
  #     weak | medium | strong   one bin
  #     all                      the whole ladder (3x the invalid clips, but
  #                              the valid twin and the scene build are shared,
  #                              so it costs far less than 3x)
  #     a comma list, e.g. "weak,strong"
  #   `strong` alone is right while checking coverage: breadth first, then
  #   three strengths of one cell.
  severity: strong

# --------------------------------------------------------------------------
# generate: only settings `taxonomy` has no use for.
# --------------------------------------------------------------------------
generate:

  # keep_going: carry on past a cell that fails and list the failures at the
  #   end. What you want for a sweep; turn it off to stop at the first error.
  keep_going: true

  # workers: container jobs run at once. A job is one (variant, scenario), so
  #   this only helps when a run spans several scenarios or several variants --
  #   `--scenario drop` alone is a single job however high you set it.
  #   Output is byte-identical at any worker count: each job writes its own
  #   directory and the per-clip rng is keyed by (seed, family, severity), never
  #   by position in a queue. Blender already uses every core per render, so
  #   N workers oversubscribe rather than scale linearly.
  workers: 4

  workdir: out/work        # raw passes + trajectories (large, gitignored)
  outdir: out/release      # the release: clips, masks, meta.json, overlays

  # ---- optional dials. Each overrides ONE field of the chosen tier; the
  #      rest of the tier is unchanged, and the name records what changed
  #      (e.g. `debug+f49`) so two overrides are never confused in meta.json.
  #
  # frames: clip length. MUST be 4k+1 -- 13, 17, 21, 25, 29, 33, ... -- so the
  #   frame count maps exactly onto a video VAE's temporal stride. A bad value
  #   is refused with the nearest two legal ones.
  # frames: 25
  #
  # fps: playback and simulation rate. Changing it changes how much real time a
  #   clip covers, and every violation window is a FRACTION of the clip, so
  #   they scale with it rather than staying a fixed number of frames.
  # fps: 12
  #
  # resolution: square render size in pixels. Render time is roughly linear in
  #   pixel count, so 256 -> 512 is about 4x.
  # resolution: 128
  #
  # spp: Cycles samples per pixel -- render noise against time. Measured at
  #   256sq: frame time ~= 1.29 + 0.0074*spp seconds, so only about a quarter
  #   of a frame is sampling and halving spp does not halve the cost.
  # spp: 16
  #
  # window: force EVERY sustained family to the same violation duration in
  #   frames. Left unset on purpose: unset means each family sizes its own
  #   window as a fraction of the clip, which is what makes a longer tier
  #   produce longer violations instead of the same brief event in a longer
  #   static shot. Setting it also overrides `permanence`'s strong bin, which
  #   is supposed to mean gone for good.
  # window: 4
  #
  # scenario / family: restrict the sweep to one of each, for a debug loop.
  # scenario: drop
  # family: solidity
  #
  # limit: stop after N cells, for a quick smoke run.
  # limit: 6
  #
  # no_overlay: skip the per-clip overlay videos. Faster, but the overlays are
  #   the thing you actually look at.
  # no_overlay: false
