# Host-side environment for PhysViol.
#
# NOTE: this env does NOT contain Kubric, Blender or PyBullet. Those live inside
# the pinned docker image and are never installed here -- see docs/PLAN.md Part 0.
# This env covers everything on the host side of the seam: annotation, residuals,
# severity maps, token grids, schema validation, visualisation and evaluation.
#
#   conda env create -f environment.yml
#   conda activate physviol
name: physviol
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy               # parabola fits, residual math
  - pillow              # reading Kubric's PNG passes
  - tifffile            # reading Kubric's depth TIFFs
  - imageio
  - imageio-ffmpeg      # mp4 encode for rgb_*.mp4 and viz overlays
  - opencv              # mask overlays, resizing, contact sheets
  - matplotlib          # severity heatmaps, report figures
  - jsonschema          # physviol validate
  - pyyaml              # configs/*.yaml -- run settings as files, not flags
  - tqdm
  - pytest
  - pypdf               # reading the papers in context/
  # Packaging a release. `physviol export` writes index.parquet with
  # pyarrow and uploads with huggingface_hub. Both are optional at
  # runtime -- the exporter falls back to JSONL and skips the upload --
  # but a published release should carry the parquet the dataset
  # viewer reads.
  - pyarrow
  - pip
  - pip:
    - huggingface_hub
