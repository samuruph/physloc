# ============================================================================
# v0_release -- the published dataset.
#
#   python -m physloc.cli taxonomy --config v0_release    # PRICE IT FIRST
#   python -m physloc.cli generate --config v0_release
#   python -m physloc.cli validate out/physloc_v0
#   python -m physloc.cli export   out/physloc_v0 --push-to samueleruf/physloc
#
# `v0` is what this RELEASE is called -- it is the outdir, and the `release`
# field stamped into every meta.json. It is NOT a tier and NOT a difficulty.
# A tier is a geometry (512x512, 30 fps, 89 frames); difficulty is the
# complexity ladder, and this release contains the WHOLE ladder rather than
# picking one rung.
#
# That is the answer to "how do I get examples of L0, L1, ... in one dataset":
# `complexity: all` partitions inside the release, in the shares declared on
# `COMPLEXITY`, and every clip carries its own `complexity` in the index, so a
# consumer filters rather than downloading four datasets.
#
# See configs/review.yaml for what every key means.
#
# PUBLISH IT. Packaging always happens; uploading is opt-in, because packaging
# is local and repeatable and uploading is neither. Copy-paste:
#
#   PHYSLOC_PUSH_TO=<user>/physloc-v0_release bash scripts/run.sh v0_release
#
# ...or set the owner once and every run publishes under its own name:
#
#   export PHYSLOC_PUSH_OWNER=<user>
#   bash scripts/run.sh v0_release          # -> <user>/physloc-v0_release
#
# Add PHYSLOC_PUSH_PRIVATE=1 for a private repo. A push REPLACES the card and
# index at that id, so a distinct name per artefact keeps a review sweep from
# overwriting a release.
# ============================================================================

# Sizing at 512x512. The severity ladder costs 3x the invalid clips, but the
# valid twin and the scene build are shared across bins, so it is the cheapest
# breadth available. Price the exact run before starting it -- these are the
# numbers `taxonomy --config v0_release` prints, not a promise:
#
#     variants   ladder gives                    parallel (4 workers)
#        3        L0 3, L1 2, L2 1, L3 1           ~670 h   2 of 5 conditions
#       10        L0 10, L1 5, L2 3, L3 2         ~1795 h   5 of 5
#
# THIS IS WEEKS ON ONE BOX. It is also embarrassingly parallel: jobs are
# independent by (scenario, seed, rung) and the per-clip rng is keyed by
# content rather than queue position, so N machines is N times faster. Split
# with `--scenario a,b,c` per machine, or a rung apiece with v0_L0..v0_L3, and
# merge the clip trees -- nothing collides.
#
defaults:
  seed: 20260824
  tier: release        # 512x512, 30 fps, 89 frames = 2.97 s, ~637 s a clip
  complexity: all      # the whole BUILT ladder, at its declared shares
  severity: all        # the full weak/medium/strong ladder
  # TEN, and it is forced rather than chosen. The condition cycle has ten slots
  # and each rung takes a share of them, so below ten the upper rungs and the
  # rarer conditions simply do not appear: at three variants L3 gets one clip
  # per cell and the release contains two of its five conditions. Ten is the
  # smallest number that makes the dataset the thing it claims to be.
  variants: 10

generate:
  keep_going: true
  workers: 4
  workdir: out/work_v0
  outdir: out/physloc_v0
