# ============================================================================
# review_L1 -- every cell at ONE level of the ladder, at debug size.
#
#   python -m physloc.cli generate --config review_L1
#   python -m physloc.cli validate out/review_L1
#   python -m physloc.cli coverage out/review_L1
#
# L1 is + materials: wood, steel, rubber, whose appearance and density agree.
# STATUS: BUILT.
#
# A heavy-looking object is heavy. Compare against L0 at the same seed and
# variant: the geometry is identical and only the surfaces and the masses
# that follow from them differ, so any change in a residual is the
# materials and nothing else.
#
# Naming a level explicitly is what overrides the ladder's share rule: a
# one-variant run of `--complexity all` produces L0 only, whereas this file
# asks for L1 and gets it.
#
# See configs/review.yaml for what every key means.
#
# PUBLISH IT. Packaging always happens; uploading is opt-in, because packaging
# is local and repeatable and uploading is neither. Copy-paste:
#
#   PHYSLOC_PUSH_TO=<user>/physloc-review_L1 bash scripts/run.sh review_L1
#
# ...or set the owner once and every run publishes under its own name:
#
#   export PHYSLOC_PUSH_OWNER=<user>
#   bash scripts/run.sh review_L1          # -> <user>/physloc-review_L1
#
# Add PHYSLOC_PUSH_PRIVATE=1 for a private repo. A push REPLACES the card and
# index at that id, so a distinct name per artefact keeps a review sweep from
# overwriting a release.
# ============================================================================

defaults:
  seed: 777
  tier: debug
  complexity: L1
  severity: strong
  variants: 1
  # ALL THIRTEEN SCENARIOS, three families. A per-level check asks "does this
  # level render every scene correctly", so breadth of SCENARIO is what matters
  # and breadth of family is `review_severity`'s job. It also keeps L2 and L3
  # affordable: an HDRI clip costs ~54 s against a solid background's ~10 s,
  # so the full matrix here would be over an hour.
  family: solidity,support,continuity

generate:
  keep_going: true
  workers: 4
  workdir: out/work_L1
  outdir: out/review_L1
