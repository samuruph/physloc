# ============================================================================
# v0_release -- the published dataset.
#
#   python -m physloc.cli taxonomy --config v0_release   # price it FIRST
#   python -m physloc.cli generate --config v0_release
#
# See configs/review.yaml for what every key means; only the values that
# differ from a review sweep are commented here.
# ============================================================================

# Shared by `generate` and `taxonomy`, so the sizing estimate is of exactly the
# run that would happen. This is why the two commands are not repeated blocks:
# anything both understand belongs here once.
# Sizing at 512x512 (`physloc taxonomy --config v0_release`). Complexity and
# variants are the dials; the severity ladder costs 3x the clips but the valid
# twin and the scene build are shared, so it is the cheapest breadth you can
# buy:
#
#     bins   variants   renders   parallel (4 workers)
#      1        1          194        6.0 h
#      3        1          554       51.1 h
#      3        2         1108      102.2 h
#      3        3         1662      153.2 h   <- as written below, 6.4 days
#
defaults:
  seed: 20260824
  tier: release        # 512x512, 30 fps, 89 frames = 2.97 s
                       # `v0` is what this RELEASE is called -- see outdir --
                       # not a tier. A tier is a geometry.
  complexity: L2       # the top BUILT rung: camera motion + materials on a
                       # plain background. L3+ need distractors and GSO.
  severity: all        # the full weak/medium/strong ladder
  variants: 3          # randomisations per cell

generate:
  keep_going: true
  workers: 4
  workdir: out/work_v0
  outdir: out/physloc_v0
