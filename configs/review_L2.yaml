# ============================================================================
# review_L2 -- every cell at ONE level of the ladder, at debug size.
#
#   python -m physloc.cli generate --config review_L2
#   python -m physloc.cli validate out/review_L2
#   python -m physloc.cli coverage out/review_L2
#
# L2 is + an HDRI environment, lit from a real capture.
# STATUS: BUILT.
#
# It was blocked on the ground being a cube below this level and a dome at it --
# a real change of collision shape. The ground is now a cube slab at EVERY
# level, and the dome survives here as a render-only BACKDROP with its
# collisions disabled, so the levels differ only in their own axis while only
# the levels that need an environment map pay for one. That is also why the
# ladder's shares fall as realism rises: see the cost table in the README.
#
# Naming a level explicitly is what overrides the ladder's share rule: a
# one-variant run of `--complexity all` produces L0 only, whereas this file
# asks for L2 and gets it.
#
# See configs/review.yaml for what every key means.
#
# PUBLISH IT. Packaging always happens; uploading is opt-in, because packaging
# is local and repeatable and uploading is neither. Copy-paste:
#
#   PHYSLOC_PUSH_TO=<user>/physloc-review_L2 bash scripts/run.sh review_L2
#
# ...or set the owner once and every run publishes under its own name:
#
#   export PHYSLOC_PUSH_OWNER=<user>
#   bash scripts/run.sh review_L2          # -> <user>/physloc-review_L2
#
# Add PHYSLOC_PUSH_PRIVATE=1 for a private repo. A push REPLACES the card and
# index at that id, so a distinct name per artefact keeps a review sweep from
# overwriting a release.
# ============================================================================

defaults:
  seed: 777
  tier: debug
  complexity: L2
  severity: strong
  variants: 1
  # ALL THIRTEEN SCENARIOS, three families. A per-level check asks "does this
  # level render every scene correctly", so breadth of SCENARIO is what matters
  # and breadth of family is `review_severity`'s job. It also keeps L2 and L3
  # affordable: an HDRI clip costs ~54 s against a solid background's ~10 s,
  # so the full matrix here would be over an hour.
  # family: solidity,support,continuity

generate:
  keep_going: true
  workers: 8 #4
  workdir: out/work_L2
  outdir: out/review_L2
