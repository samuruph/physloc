# ============================================================================
# v0_L2 -- the published dataset, at ONE level of the ladder.
#
#   python -m physloc.cli taxonomy --config v0_L2    # PRICE IT FIRST
#   python -m physloc.cli generate --config v0_L2
#   python -m physloc.cli validate out/physloc_v0_L2
#   python -m physloc.cli export   out/physloc_v0_L2 --push-to <user>/physloc-l2
#
# L2 adds an HDRI environment.
#
# Lit by one of 36 real captures, on the same dome that is the ground at
# every level. An HDRI clip costs several times an L0 one at debug size --
# at release geometry the gap is much smaller; see `physloc/render/probe_cost.py`.
#
# WHY A CONFIG PER LEVEL. `v0_release` walks the whole ladder in one run and is
# the thing to publish; these exist for when you want one level on its own --
# to spread a release across machines a level at a time, to regenerate a single
# level after a fix, or to ship a smaller dataset that is only ever L0.
#
# Each writes to its OWN outdir, so levels generated separately can simply be
# merged: the clip tree is keyed by level already
# (`clips/<release>/L2/<scenario>/<seed>/`) and every level draws from its own
# seed block, so nothing collides.
#
# The five difficulty conditions apply here exactly as they do in a full run --
# they are not levels, and every level carries all of them.
#
# See configs/review.yaml for what every key means.
#
# PUBLISH IT. Packaging always happens; uploading is opt-in, because packaging
# is local and repeatable and uploading is neither. Copy-paste:
#
#   PHYSLOC_PUSH_TO=<user>/physloc-v0_L2 bash scripts/run.sh v0_L2
#
# ...or set the owner once and every run publishes under its own name:
#
#   export PHYSLOC_PUSH_OWNER=<user>
#   bash scripts/run.sh v0_L2          # -> <user>/physloc-v0_L2
#
# Add PHYSLOC_PUSH_PRIVATE=1 for a private repo. A push REPLACES the card and
# index at that id, so a distinct name per artefact keeps a review sweep from
# overwriting a release.
# ============================================================================

defaults:
  seed: 20260824
  tier: release        # 512x512, 30 fps, 89 frames = 2.97 s
  complexity: L2
  severity: all        # the full weak/medium/strong ladder
  # THE SHARE THIS LEVEL WOULD GET IN A FULL RUN, so the four configs PARTITION
  # `v0_release` rather than each being a release of their own: generating all
  # four gives exactly what `--complexity all --variants 10` gives, and
  # generating one gives exactly that level's part of it.
  #
  # `variants_at("L2", 10)` = 3, from the level's declared share.
  variants: 3

generate:
  keep_going: true
  workers: 4
  workdir: out/work_v0_L2
  outdir: out/physloc_v0_L2
