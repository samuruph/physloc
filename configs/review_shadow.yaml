# ============================================================================
# review_shadow -- quick smoke review for the shadow scenario and optical
# shadow families.
#
#   python -m physloc.cli taxonomy --config review_shadow
#   bash scripts/run_reviews.sh review_shadow
#
# This is intentionally small: one L0 debug variant over the `shadow_track`
# scenario, with all severity bins for the three families whose violation is
# the shadow itself. It is the fast pass to run after touching shadow casting,
# shadow masks, shadow ownership, or the optical injectors.
# ============================================================================

defaults:
  seed: 777
  tier: debug
  resolution: 128
  fps: 12
  frames: 25
  spp: 16
  complexity: L0
  variants: 1
  severity: all
  scenario: shadow_track
  family: shadow,shadow_inverted,shadow_shape

generate:
  keep_going: true
  workers: auto
  workdir: out/work_review_shadow
  outdir: out/review_shadow
